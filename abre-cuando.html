<main>

<section class="section">

    <div class="section-heading">

        <span class="small-title">
            PEQUEÑAS CARTAS
        </span>

        <h1>
            Abre cuando... 💌
        </h1>

        <p>
            Hay cosas que quiero que sepas incluso cuando
            no esté a tu lado.
        </p>

    </div>


    <div class="when-grid">


        <button
            class="when-card"
            data-title="estés triste"
            data-message="Recuerda que no todo es tan malo,
            ni tan negro como ahora lo ves,
            la vida te tiene muchas cosas buenas,
            mucha gente te quiere y entre ellas nunca dudes que estoy yo.
            Ahora no es el mejor momento pero piensa en las cosas buenas
            y apoyate sin dudarlo en la gente que te quiere
            tu puedes con todo mi chica."
        >

            <span>
                💌
            </span>

            <strong>
                estés triste
            </strong>

        </button>


        <button
            class="when-card"
            data-title="me eches de menos"
            data-message="Se que es complicado estar separados sobre todo si es bastante tiempo, no sinentes tan visualmente ese afecto y te asaltan pensamientos o recuerdos malos y en una relación valorad el ver bastante a la otra persona. Pero hay veces que yo no puedo, tenemos algo que hacer y sabíamos que iba a haber muchos momentos donde nos ibamos a echar de menos viviendo tan lejos. Se que muchas veces desearias que en vez de estar pensando eso estuviera a tú lado. Pero ten esto siempre en cuenta, por muy lejos que estemos o mucho que llevemos sin vernos yo te seguire queriendo porque eres mi an y seguiremos teniendonos el uno al otro. Podrás sentir mi amor, esté o no."
        >

            <span>
                💌
            </span>

            <strong>
                me eches de menos
            </strong>

        </button>


        <button
            class="when-card"
            data-title="no puedas dormir"
            data-message="An, ya sea porque no tienes sueño, estás ocupada con algo o tines algún problema que te lo impide. Has de saber que no pasa nada por dejarlo pasar sobre todo si son cosas malas, claro que se que muchas veces es muy difícil no pensar en ello si no imposible, pero darle vueltas a las cosas, estar en vela o incluso no dormir por miedo no es la solución. El sueño como muchas cosas más es importante y mi an tiene que estar perfecta. Por eso cuando no puedas dormirte piensa, no pasa nada voy a cerrar los ojos, voy a olvidarme del mundo de todo lo que hay fuera de esta tranquilidad, y duerme mi chica."
        >

            <span>
                💌
            </span>

            <strong>
                no puedas dormir
            </strong>

        </button>


        <button
            class="when-card"
            data-title="necesites sonreír"
            data-message="An, se que algunos días y algunas cosas son muy duros. Y cuando los vivies tu cabeza está llena de negro y pensamientos horribles. Pero querer estar bien es el primer paso. Es complicado sonreir ahora, eso nadie te lo niega, pero era complicado cuando estabamos en el barraco pasandolo bien? O cuando estabamos en el pueblo de la mano mientras paseabamos? Hay muchos momentos que merecen la pena ser recordados. Y si no quieres que te hable del pasado te hablo del ahora. Me tienes a mí, loco perdido por ti jajajaja, que quiero un montón a mi chica. Tienes a tus amigas a tocaya a Lisa a Alba y a mucha más gente. Tienes a tu familia en los que te puedes apoyar y están ahí en los momentos más dificiles. Sonrie an, porque estás por encima de cualquier mierda que se te ponga por delante."
        >

            <span>
                💌
            </span>

            <strong>
                necesites sonreír
            </strong>

        </button>


        <button
            class="when-card"
            data-title="hayas tenido un día increíble"
            data-message="ESOOOO MI ANNN. Me alegro un montón por tú día. No dudes de que te lo mereces, te mereces todos los días buenos que tengas y más. Recuerda este día porque al igual que hay días malos hay días muy buenos y este es el ejemplo. Esto te demuestra que la vida aunque sea compleja no es tan mala tiene muchas cosas buenas. Si tu eres feliz yo soy feliz, que día más guay ehhhhh."
        >

            <span>
                💌
            </span>

            <strong>
                hayas tenido un día increíble
            </strong>

        </button>


        <button
            class="when-card"
            data-title="quieras saber cuánto te quiero"
            data-message="Jajaja, que tonta, ya deberías de saberlo mi chica. Te quiero mucho pero no un mucho como palabra un mucho que no cabe en mi boca como para poder decirlo, o en mi cabeza para poder expresarlo. Tú an has hecho que mi vida coja otro color, un color que la ha vuelto un cuadro precioso. Te quiero an y te quiero mucho todo el rato es por eso que es tanto que tengo que estar soltandotelo cada 2 por 3. Sé que a veces hago cosas que no reflejan lo que siento o lo importante que eres para mi, que soy un estupido, pero aunque tenga mis errores para mostrarlo te quiero y lo seguirás viendo día tras día. No te preocupes porque esto cese, si se me olvida solo tengo que volver a pensar en ti, volver hablar contigo o volver a verte. Tú has hecho que te quiera an, que te quiera mucho."
        >

            <span>
                💌
            </span>

            <strong>
                quieras saber cuánto te quiero
            </strong>

        </button>


    </div>

</section>
